services:
  db:
    image: postgres:15
    restart: "no"
    environment:
      POSTGRES_DB: shtab_ai_test
      POSTGRES_USER: shtab_ai_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: /srv/video/shtab-ai-docker-test/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shtab_ai_test -d shtab_ai_test"]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  postgres_password:
    file: ./config/postgres-password
