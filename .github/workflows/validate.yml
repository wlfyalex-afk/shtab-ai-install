name: Validate distribution
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Flask psycopg2-binary PyYAML
      - run: python -m unittest discover -s tests
      - run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - run: node --check app/static/import-status008.js
      - run: sha256sum --quiet -c SHA256SUMS
      - name: Validate Compose in all acceleration modes
        run: |
          mkdir -p secrets
          printf 'validation' > secrets/db_password
          printf 'validation' > secrets/flask_secret
          printf 'SHTAB_HTTPS_HOST=localhost\nSHTAB_HTTPS_SITES=https://localhost\n' > .env
          python -c 'import json,runpy; from pathlib import Path; m=runpy.run_path("scripts/configure-storage.py"); Path("compose.storage.yaml").write_text(json.dumps(m["volume_configuration"](Path("/opt/shtab-ai-021"))))'
          for mode in cpu nvidia amd; do
            python scripts/configure-acceleration.py . "$mode"
            bash scripts/dc.sh config --quiet
          done
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts using Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; throw "Parse failed: $($_.FullName)" }
          }
      - name: Check missing WSL probe using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-WSLProbe.ps1
      - name: Check complete bootstrap download using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-BootstrapDownload.ps1
      - name: Check persistent download cache
        shell: powershell
        run: .\tests\Test-DownloadCache.ps1
      - name: Check installation stages and model progress using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-InstallationProgress.ps1
      - name: Check virtualization before downloads using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-VirtualizationPreflight.ps1
      - name: Check 12 GB memory policy using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-MemoryLimits.ps1
      - name: Check legacy WSL runtime installation using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-WSLRuntimeInstall.ps1
      - name: Check dynamic LAN configuration using Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-RuntimeNetwork.ps1
      - name: Check GPU selection and cleanup paths using Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\Test-GPUSelection.ps1
          .\tests\Test-CleanupPaths.ps1
      - name: Parse Windows menu commands
        shell: powershell
        run: |
          $commands = @(Get-Content Start-ShtabAI-Windows.cmd -Encoding UTF8 | Where-Object { $_ -match '^powershell.exe .* -Command "(.+)"$' } | ForEach-Object { [regex]::Match($_, '-Command "(.+)"$').Groups[1].Value })
          if ($commands.Count -ne 2) { throw 'Expected install and uninstall commands.' }
          foreach ($command in $commands) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($command, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; throw 'Menu command parse failed.' }
          }

